[build]
  command = "npm run build"
  publish = "dist"

# Force HTTPS — redirect all HTTP traffic to HTTPS
[[redirects]]
  from = "http://saplingandseeds.com/*"
  to = "https://www.saplingandseeds.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.saplingandseeds.com/*"
  to = "https://www.saplingandseeds.com/:splat"
  status = 301
  force = true

# Redirect apex domain to www
[[redirects]]
  from = "https://saplingandseeds.com/*"
  to = "https://www.saplingandseeds.com/:splat"
  status = 301
  force = true

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & performance headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived cache for immutable hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML (always re-validate)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache public static files (images, fonts, etc.)
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"
